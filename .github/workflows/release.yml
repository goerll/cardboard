name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "packaging/**", "scripts/package.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CEF_PATH: ${{ github.workspace }}/.cef
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ matrix.name }}-${{ hashFiles('desktop/Cargo.lock') }}
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # Git Bash's coreutils `link` would shadow the MSVC linker.
      - if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe
      - run: pnpm -C ui install --frozen-lockfile && pnpm -C ui build
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cardboard-${{ matrix.name }}
          path: dist/cardboard-${{ matrix.name }}.*
          if-no-files-found: error
      # Each platform attaches itself to the release as soon as it's built.
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cardboard-${{ matrix.name }}.*
          generate_release_notes: true

  # Signs every archive for the in-app updater (src/update.rs, docs/releasing.md). Runs once all
  # platforms are built; until then clients see the release as "not available yet".
  sign:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cardboard-*
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign && minisign -v
      - name: Sign archives
        env:
          # The whole key file (comment line + key line) from `minisign -G -W`.
          CARDBOARD_UPDATE_KEY: ${{ secrets.CARDBOARD_UPDATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CARDBOARD_UPDATE_KEY" ]; then
            echo "::error::The CARDBOARD_UPDATE_KEY secret is missing. Refusing to publish unsigned updates; see docs/releasing.md."
            exit 1
          fi
          key="$RUNNER_TEMP/update.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$CARDBOARD_UPDATE_KEY" > "$key")
          chmod 600 "$key"
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          archives=(dist/cardboard-*.tar.gz dist/cardboard-*.zip)
          [ "${#archives[@]}" -eq 4 ] || { echo "::error::expected 4 archives, found ${#archives[@]}"; exit 1; }
          for file in "${archives[@]}"; do
            name="$(basename "$file")"
            # The client checks both fields, so a signature can't be reused for another file or release.
            minisign -S -s "$key" -m "$file" -x "$file.minisig" -t "cardboard file:$name version:$version" < /dev/null
            # Fails loudly if the secret doesn't match the key compiled into the app.
            minisign -V -H -p packaging/update.pub -m "$file" -x "$file.minisig"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.minisig
          fail_on_unmatched_files: true
