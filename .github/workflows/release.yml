name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "packaging/**", "scripts/package.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CEF_PATH: ${{ github.workspace }}/.cef
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ matrix.name }}-${{ hashFiles('desktop/Cargo.lock') }}
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # Git Bash's coreutils `link` would shadow the MSVC linker.
      - if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe
      - run: npm --prefix ui ci && npm --prefix ui run build
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cardboard-${{ matrix.name }}
          path: dist/cardboard-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
