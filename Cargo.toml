[package]
name = "cardboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An open source HTML/CSS design editor with an agent interface"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "signal"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio", "ws", "query"] }
rust-embed = "8.7"
getrandom = "0.3"
html5ever = "0.40"
# Already in the tree via axum; used to drive headless Chromium for screenshots.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
base64 = "0.22"

[workspace]
exclude = ["desktop"]

